function restoreDefault({world=false}={}){
 focusedCountry='';focusedLocationId=null;hoveredId=null;
 countrySelect.value='';
 document.querySelectorAll('[data-filter]').forEach(button=>button.classList.toggle('active',button.dataset.filter==='all'));
 document.querySelectorAll('.marker').forEach(marker=>marker.classList.remove('hidden'));
 if(world)reset();
 refresh();
}
function refresh(){
 const filter=document.querySelector('[data-filter].active')?.dataset.filter||'all';
 for(const {d,path} of paths){
  const visible=filter==='all'||filter===d.type;
  path.style.display=visible?'':'none';
  const focus=focusedLocationId!==null ? d.id===focusedLocationId :
    focusedCountry ? d.country===focusedCountry :
    hoveredId!==null ? d.id===hoveredId : false;
  path.classList.toggle('focus',!!focus);
  path.classList.toggle('dim',!!(focusedCountry||focusedLocationId!==null||hoveredId!==null)&&!focus);
 }
 document.querySelectorAll('.marker').forEach((marker,i)=>{
  const d=data[i];
  const focus=focusedLocationId!==null ? d.id===focusedLocationId :
    focusedCountry ? d.country===focusedCountry :
    hoveredId!==null ? d.id===hoveredId : false;
  marker.classList.toggle('dim',!!(focusedCountry||focusedLocationId!==null||hoveredId!==null)&&!focus);
  marker.classList.toggle('focus',!!focus);
 });
}
countrySelect.addEventListener('change',()=>{
 if(!countrySelect.value){restoreDefault({world:true});return;}
 focusedCountry=countrySelect.value;focusedLocationId=null;hoveredId=null;
 refresh();
});
// Reset restores world framing, every route and the All Locations filter.
document.getElementById('reset').addEventListener('click',()=>restoreDefault({world:true}));
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{
 if(button.dataset.filter==='all'){
  // Selecting All Locations clears a location or country selection and
  // returns to the complete default network view.
  restoreDefault({world:true});
 }else{
  // Changing category is a filter, not a change of geographic selection.
  refresh();
 }
}));
document.querySelectorAll('.marker').forEach((marker,i)=>{
 marker.addEventListener('pointerenter',()=>{hoveredId=data[i].id;refresh()});
 marker.addEventListener('pointerleave',()=>{hoveredId=null;refresh()});
 marker.addEventListener('focus',()=>{hoveredId=data[i].id;refresh()});
 marker.addEventListener('blur',()=>{hoveredId=null;refresh()});
 marker.addEventListener('click',()=>{
  const location=data[i];
  const sameLocation=focusedLocationId===location.id;
  if(sameLocation){restoreDefault();return;}
  focusedLocationId=location.id;focusedCountry='';
  countrySelect.value='';hoveredId=null;
  refresh();
 });
});
refresh();
})();
